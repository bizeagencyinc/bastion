# =====================================================================
# BASTION TEMPLATE | nginx security headers and hardening
# Rules: FE-02, WEB-01, OPS-18, PHP-03
# Include inside your server { } block:  include snippets/bastion-security.conf;
# =====================================================================

server_tokens off;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Start with Report-Only, then enforce.
add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

# Request limits
client_max_body_size 10m;
client_body_timeout 15s;
client_header_timeout 15s;

# Block hidden files except .well-known
location ~ /\.(?!well-known) { deny all; return 404; }

# Block backups, dumps, and config files
location ~* \.(bak|old|sql|log|ini|env|sh|swp)$ { deny all; return 404; }

# No PHP execution in upload folders
location ~* /(uploads|files|storage)/.*\.(php|phtml|phar)$ { deny all; return 404; }

