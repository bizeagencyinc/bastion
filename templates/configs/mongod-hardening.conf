# =====================================================================
# BASTION TEMPLATE | mongod.conf hardening (self-hosted MongoDB)
# Rules: NOSQL-01 to NOSQL-03, NOSQL-08, NOSQL-10
# Create the admin user BEFORE enabling authorization, then restart.
# =====================================================================
net:
  port: 27017
  bindIp: 127.0.0.1,10.0.0.5          # private addresses only, never 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/ssl/mongodb/server.pem
    CAFile: /etc/ssl/mongodb/ca.pem

security:
  authorization: enabled
  javascriptEnabled: false            # blocks $where, $function, mapReduce JS
  # keyFile: /etc/mongodb/keyfile     # required for replica sets

setParameter:
  authenticationMechanisms: SCRAM-SHA-256

storage:
  dbPath: /var/lib/mongodb

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  redactClientLogData: true           # Enterprise only; remove on Community
