# =====================================================================
# BASTION TEMPLATE | redis.conf / valkey.conf hardening
# Rules: NOSQL-15 to NOSQL-18
# =====================================================================

# Network: private interfaces only
bind 127.0.0.1 10.0.0.5
protected-mode yes
port 0                                # disable plaintext port
tls-port 6379
tls-cert-file /etc/redis/tls/redis.crt
tls-key-file /etc/redis/tls/redis.key
tls-ca-cert-file /etc/redis/tls/ca.crt

# ACL users (put real passwords in the ACL file, not here)
aclfile /etc/redis/users.acl
# Example users.acl:
#   user default off
#   user app on >CHANGE_ME_LONG_RANDOM ~app:* &app:* +@read +@write +@connection -@dangerous
#   user admin on >CHANGE_ME_LONG_RANDOM ~* &* +@all

# Memory and persistence
maxmemory 512mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
