# =====================================================================
# Publish Bastion: npm package (with provenance) + MCP Registry + GitHub release
# Trigger: push a tag like v2.3.0
#
# One-time setup (see HANDOVER.md):
#   - npm: configure a Trusted Publisher for package "bastion-security-mcp"
#     (npmjs.com > package > Settings > Trusted publishing > GitHub Actions,
#      repo bizeagencyinc/bastion, workflow publish.yml).
#     For the very first publish, either publish once by hand or add an NPM_TOKEN secret.
#   - MCP Registry: nothing; github-oidc login works for io.github.<owner>/* names.
# Pin actions to commit SHAs after the first green run (OPS-02).
# =====================================================================
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Check tag matches versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          test "$(node -p "require('./mcp/package.json').version")" = "$TAG"
          test "$(node -p "require('./mcp/server.json').version")" = "$TAG"
          test "$(node -p "require('./plugin/.claude-plugin/plugin.json').version")" = "$TAG"
      - name: Test MCP server
        working-directory: mcp
        run: |
          npm ci
          npm test
      - name: Plugin is in sync with sources
        working-directory: mcp
        run: |
          npm run build:plugin
          git diff --exit-code -- ../plugin

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write          # npm provenance + trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest
      - name: Publish
        working-directory: mcp
        run: |
          npm ci
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # optional when Trusted Publishing is configured

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write          # github-oidc login to the MCP Registry
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        working-directory: mcp
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish

  github-release:
    needs: mcp-registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build release zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=bastion/ -o "bastion-${VERSION}.zip" HEAD
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "bastion-${GITHUB_REF_NAME}.zip" \
            --title "Bastion $GITHUB_REF_NAME" --notes "$NOTES"
